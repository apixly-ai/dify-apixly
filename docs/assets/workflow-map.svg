="12" fill="#0f172a" stroke="#1670f0" stroke-opacity=".4"/><text x="1434" y="308" text-anchor="middle" font-size="17" fill="#e2e8f0">Dify file</text><text x="849" y="370" font-size="17" fill="#8ec9ff">1 generation submission</text><rect x="72" y="438" width="704" height="246" rx="22" fill="url(#panel)" stroke="#334155"/><rect x="96" y="464" width="44" height="38" rx="10" fill="#1670f0" fill-opacity=".18"/><text x="118" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#8ec9ff">03</text><text x="158" y="490" font-size="28" font-weight="700" fill="#f8fafc">Text to video</text><text x="97" y="532" font-size="20" fill="#94a3b8">Create a short clip from a written scene.</text><rect x="96" y="560" width="140" height="52" rx="12" fill="#0f172a" stroke="#1670f0" stroke-opacity=".4"/><text x="166" y="592" text-anchor="middle" font-size="17" fill="#e2e8f0">Prompt</text><path d="M243 586h17m-5-5 5 5-5 5" stroke="#2e8fff" stroke-width="2" fill="none"/><rect x="268" y="560" width="140" height="52" rx="12" fill="#0f172a" stroke="#1670f0" stroke-opacity=".4"/><text x="338" y="592" text-anchor="middle" font-size="17" fill="#e2e8f0">Create video</text><path d="M415 586h17m-5-5 5 5-5 5" stroke="#2e8fff" stroke-width="2" fill="none"/><rect x="440" y="560" width="140" height="52" rx="12" fill="#0f172a" stroke="#1670f0" stroke-opacity=".4"/><text x="510" y="592" text-anchor="middle" font-size="17" fill="#e2e8f0">Query task</text><path d="M587 586h17m-5-5 5 5-5 5" stroke="#2e8fff" stroke-width="2" fill="none"/><rect x="612" y="560" width="140" height="52" rx="12" fill="#0f172a" stroke="#1670f0" stroke-opacity=".4"/><text x="682" y="592" text-anchor="middle" font-size="17" fill="#e2e8f0">Dify file</text><text x="97" y="654" font-size="17" fill="#8ec9ff">1 generation submission</text><rect x="824" y="438" width="704" height="246" rx="22" fill="url(#panel)" stroke="#334155"/><rect x="848" y="464" width="44" height="38" rx="10" fill="#1670f0" fill-opacity=".18"/><text x="87