<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810" role="img" aria-labelledby="title desc"><title id="title">Four Apixly Media starting workflows</title><desc id="desc">Illustrated map of the four included Dify DSLs: text to image, reference edit, text to video and connected image to video. Each generation is submitted once and existing tasks are queried.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc" stop-opacity=".065"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".02"/></linearGradient><linearGradient id="brand"><stop stop-color="#00AEEF"/><stop offset=".5" stop-color="#1670f0"/><stop offset="1" stop-color="#635bff"/></linearGradient></defs><rect width="1600" height="810" rx="28" fill="#06070a"/><g font-family="Arial,Helvetica,sans-serif"><text x="72" y="70" font-size="34" font-weight="700" fill="#f8fafc">Choose a starting workflow</text><text x="72" y="107" font-size="20" fill="#94a3b8">Four importable Dify DSLs. Bring your own Apixly API key.</text><rect x="72" y="154" width="704" height="246" rx="22" fill="url(#panel)" stroke="#334155"/><rect x="96" y="180" width="44" height="38" rx="10" fill="#1670f0" fill-opacity=".18"/><text x="118" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#8ec9ff">01</text><text x="158" y="206" font-size="28" font-weight="700" fill="#f8fafc">Text to image</text><text x="97" y="248" font-size="20" fill="#94a3b8">Turn a brief into a downloadable image.</text><rect x="96" y="276" width="140" height="52" rx="12" fill="#0f172a" stroke="#1670f0" stroke-opacity=".4"/><text x="166" y="308" text-anchor="middle" font-size="17" fill="#e2e8f0">Prompt</text><path d="M243 302h17m-5-5 5 5-5 5" stroke="#2e8fff" stroke-width="2" fill="none"/><rect x="268" y="276" width="140" height="52" rx="12" fill="#0f172a" stroke="#1670f0" stroke-opacity=".4"/><text x="338" y="308" text-anchor="middle" font-size="17" fill="#e2e8f0">Generate</text><path 