        plugin_unique_identifier: apixly-ai/apixly_media:0.2.0@07c2e83687095ef46fa804564fa756df2a842344c5163a2763d3901494e5f59a
        tool_name: edit_image
        tool_label: Submit ONCE · 仅提交一次
        tool_description: Apixly media API tool; use the provider's secret credential.
        tool_node_version: '2'
        tool_configurations: {}
        tool_parameters:
          model:
            type: mixed
            value: '{{#start.model#}}'
