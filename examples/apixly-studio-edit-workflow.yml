app:
  name: Apixly Studio · reference edit · controls OFF
  description: Viewpoint, Lighting and Camera & Lens each have their own free control
    card. All default OFF. One Compose validates every settings packet; invalid controls
    stop before any media submission. https://apixly.ai
  icon: 🎨
  icon_background: '#2e8fff'
  icon_type: emoji
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: apixly-ai/apixly_media:0.2.0@07c2e83687095ef46fa804564fa756df2a842344c5163a2763d3901494e5f59a
    version: null
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: apixly-ai/apixly_creative:0.1.0@ae48835fc3312d9cda51966d1a70e8987df37a82b4934070963ae2657b27e12e
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
