    - id: start
      type: custom
      width: 244
      height: 110
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: start
        title: Start · 开始
        desc: ''
        selected: false
        variables:
        - variable: model
          label: Exact model ID / 精确模型 ID
          type: text-input
          required: true
          default: gemini-3.1-flash-image
          max_length: 256
          options: []
        - variable: prompt
          label: Prompt / 提示词
          type: paragraph
          required: true
          default: Keep the product unchanged and replace only its background with
            a soft gray studio backdrop.
          max_length: 20000
          options: []
        - variable: advanced_parameters
          label: Advanced JSON / 高级参数
          type: paragraph
          required: false
          default: '{}'
          max_length: 12000
          options: []
        - variable: reference_image
          label: Reference URL or data URL / 参考图 URL 或 data URL
          type: paragraph
          required: true
          default: ''
          max_length: 1048576
          options: []
        - variable: additional_images
          label: Additional reference JSON / 更多参考图数组
          type: paragraph
          required: false
          default: '[]'
          max_length: 1048576
          options: []
    - id: submit
      type: custom
      width: 244
      height: 110
      position:
        x: 1380
        y: 260
      positionAbsolute:
        x: 1380
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: tool
        title: Submit ONCE · 仅提交一次
        desc: ''
        selected: false
        provider_id: apixly-ai/apixly_media/apixly_media
        provider_name: apixly-ai/apixly_media/apixly_media
        provider_type: builtin
