app:
  name: Apixly · Free creative preview
  description: 'Free prompt preview inside Dify: no API key, generation or network
    call. All three control groups default OFF. Enable a group in the compose node,
    choose its preset/values, and inspect final_prompt. https://apixly.ai'
  icon: 🎨
  icon_background: '#2e8fff'
  icon_type: emoji
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: apixly-ai/apixly_creative:0.1.0@b49f728080d62147c89241cd87dae587834c0c2a9120c28b37db468c7c43011a
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      width: 244
      height: 110
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: start
        title: Start · 开始
        desc: ''
        selected: false
        variables:
        - variable: prompt
          label: Base prompt / 原始提示词
          type: paragraph
          required: false
          default: A red toy car with a blue roof on a studio table.
          max_length: 20000
          options: []
    - id: creative_compose
      type: custom
      width: 244
      height: 110
      position:
        x: 340
        y: 260
      positionAbsolute:
        x: 340
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: tool
        title: Creative prompt
        desc: ''
        selected: false
        provider_id: apixly-ai/apixly_creative/apixly_creative
        provider_name: apixly-ai/apixly_creative/apixly_creative
        provider_type: builtin
        plugin_id: apixly-ai/apixly_creative
        plugin_unique_identifier: apixly-ai/apixly_creative:0.1.0@b49f728080d62147c89241cd87dae587834c0c2a9120c28b37db468c7c43011a
        tool_name: compose_creative_prompt
        tool_label: Preview creative prompt
        tool_description: Free preview inside Dify. No key or generation. Controls
          default OFF.
        tool_node_version: '2'
        tool_configurations: {}
        tool_parameters:
          angle_enabled:
            type: constant
            value: false
          angle_preset:
            type: constant
            value: custom
          angle_yaw:
            type: constant
            value: 0
          angle_pitch:
            type: constant
            value: 0
          angle_shot:
            type: constant
            value: none
          lighting_enabled:
            type: constant
            value: false
          lighting_preset:
            type: constant
            value: ''
          lighting_brightness:
            type: constant
            value: 50
          lighting_color:
            type: mixed
            value: ''
          lighting_key_light:
            type: constant
            value: ''
          lighting_rim_light:
            type: constant
            value: false
          lighting_smart_text:
            type: mixed
            value: ''
          camera_enabled:
            type: constant
            value: false
          camera_body:
            type: constant
            value: ''
          camera_lens:
            type: constant
            value: ''
          camera_aperture:
            type: constant
            value: ''
          prompt:
            type: mixed
            value: '{{#start.prompt#}}'
          mode:
            type: constant
            value: generate
        is_team_authorization: true
        retry_config:
          retry_enabled: false
          max_retries: 1
          retry_interval: 1000
    - id: creative_ready
      type: custom
      width: 244
      height: 110
      position:
        x: 650
        y: 260
      positionAbsolute:
        x: 650
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: if-else
        title: Valid prompt?
        desc: ''
        selected: false
        cases:
        - id: 'true'
          case_id: 'true'
          logical_operator: and
          conditions:
          - id: composition-valid
            varType: boolean
            variable_selector:
            - creative_compose
            - success
            comparison_operator: is
            value: true
    - id: creative_result
      type: custom
      width: 244
      height: 110
      position:
        x: 970
        y: 260
      positionAbsolute:
        x: 970
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: end
        title: Prompt
        desc: ''
        selected: false
        outputs:
        - variable: final_prompt
          value_selector:
          - creative_compose
          - final_prompt
          value_type: string
    - id: creative_error
      type: custom
      width: 244
      height: 110
      position:
        x: 970
        y: 80
      positionAbsolute:
        x: 970
        y: 80
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: end
        title: Check controls
        desc: ''
        selected: false
        outputs:
        - variable: creative_error_message
          value_selector:
          - creative_compose
          - error
          value_type: string
    edges:
    - id: start-source-creative_compose
      type: custom
      source: start
      sourceHandle: source
      target: creative_compose
      targetHandle: target
      zIndex: 0
      data:
        sourceType: start
        targetType: tool
        isInLoop: false
        isInIteration: false
    - id: creative_compose-source-creative_ready
      type: custom
      source: creative_compose
      sourceHandle: source
      target: creative_ready
      targetHandle: target
      zIndex: 0
      data:
        sourceType: tool
        targetType: if-else
        isInLoop: false
        isInIteration: false
    - id: creative_ready-true-creative_result
      type: custom
      source: creative_ready
      sourceHandle: 'true'
      target: creative_result
      targetHandle: target
      zIndex: 0
      data:
        sourceType: if-else
        targetType: end
        isInLoop: false
        isInIteration: false
    - id: creative_ready-false-creative_error
      type: custom
      source: creative_ready
      sourceHandle: 'false'
      target: creative_error
      targetHandle: target
      zIndex: 0
      data:
        sourceType: if-else
        targetType: end
        isInLoop: false
        isInIteration: false
    viewport:
      x: 0
      y: 0
      zoom: 0.4
