app:
  name: Apixly · Image to video · 图片到视频
  description: 'Use your own Apixly key. Two billable API submissions: generate one
    image, then use its signed HTTPS URL with the explicitly selected reference-video
    model. Each stage submits once and polls with a bounded loop. https://apixly.ai
    · https://platform.apixly.ai'
  icon: 🎨
  icon_background: '#2e8fff'
  icon_type: emoji
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: apixly-ai/apixly_media:0.1.0@b270fd8743aa3803d848ad94e852f98e1cddd1bc9bbb53d0e8a1a91cf8a5b1e7
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: image_start
      type: custom
      width: 244
      height: 110
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: start
        title: Start · 开始
        desc: ''
        selected: false
        variables:
        - variable: image_model
          label: Image model / 图片模型
          type: text-input
          required: true
          default: grok-imagine-image
          max_length: 256
          options: []
        - variable: image_prompt
          label: Image prompt / 图片提示词
          type: paragraph
          required: true
          default: A single blue glass vase on a clean white studio table, no text.
          max_length: 12000
          options: []
        - variable: image_parameters
          label: Image advanced JSON / 图片高级参数
          type: paragraph
          required: false
          default: '{}'
          max_length: 12000
          options: []
        - variable: video_model
          label: Video model / 视频模型
          type: text-input
          required: true
          default: grok-imagine-video-1.5-preview
          max_length: 256
          options: []
        - variable: video_prompt
          label: Video prompt / 视频提示词
          type: paragraph
          required: true
          default: Use the reference image as the first frame. Preserve the exact
            blue vase and composition while the camera moves gently. No text.
          max_length: 12000
          options: []
        - variable: video_seconds
          label: Video seconds / 视频秒数
          type: number
          required: true
          default: 3
          max_length: 256
          options: []
    - id: image_submit
      type: custom
      width: 244
      height: 110
      position:
        x: 340
        y: 260
      positionAbsolute:
        x: 340
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
