        tool_name: generate_image
        tool_label: Submit ONCE · 仅提交一次
        tool_description: Apixly media API tool; use the provider's secret credential.
        tool_node_version: '2'
        tool_configurations: {}
        tool_parameters:
          model:
            type: variable
            value:
            - image_start
