identity:
  name: create_video
  author: apixly-ai
  label:
    en_US: Create video
    zh_Hans: 生成视频
description:
  human:
    en_US: Submit one asynchronous video task. Default grok-imagine-video is text-only.
      Grok 1.5 preview references require public HTTPS URLs; inline base64 and explicit
      geometry controls are rejected. Reference-video dimensions follow the source
      image; inspect the result. Models and URLs are sent unchanged; never retry a
      paid submission automatically.
    zh_Hans: 一次提交异步视频。默认 Grok 仅文生视频；1.5 preview 参考图须用公开 HTTPS URL，不接收内联 base64 或显式几何控制。参考视频尺寸跟随源图，以成品为准。模型与链接原样发送，不自动重试收费提交。
  llm: Submit one asynchronous video task. Default grok-imagine-video is text-only.
    Grok 1.5 preview references require public HTTPS URLs; inline base64 and explicit
    geometry controls are rejected. Reference-video dimensions follow the source image;
    inspect the result. Models and URLs are sent unchanged; never retry a paid submission
    automatically.
parameters:
- name: model
  type: string
  required: true
  label:
    en_US: Exact model ID
    zh_Hans: 精确模型 ID
  human_description:
    en_US: Exact Apixly model ID available to your key. Sent unchanged. The plugin
      never substitutes another model.
    zh_Hans: 使用当前 API Key 可用的完整模型 ID。原样发送，不自动替换。
  llm_description: Exact Apixly model ID available to your key. Sent unchanged. The
    plugin never substitutes another model.
  form: llm
  default: grok-imagine-video
- name: prompt
  type: string
  required: true
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Describe the desired output or edit.
    zh_Hans: 描述想要生成的内容或对参考图的修改要求。
  llm_description: Describe the desired output or edit.
  form: llm
- name: seconds
  type: number
  required: false
  label:
    en_US: Duration (seconds)
    zh_Hans: 视频时长（秒）
  human_description:
    en_US: 'Exact duration supported by your selected model. Grok example: 1 second.'
    zh_Hans: 按所选模型能力填写；Grok 示例为 1 秒。
  llm_description: 'Exact duration supported by your selected model. Grok example:
    1 second.'
  form: llm
  min: 1
  max: 30
  default: 1
- name: resolution
  type: string
  required: false
  label:
    en_US: Resolution
    zh_Hans: 视频分辨率
  human_description:
    en_US: Optional geometry control for models that support it. Leave empty for Grok
      1.5 preview reference video, whose output follows the source image.
    zh_Hans: 仅支持该控制的型号可填写。Grok 1.5 preview 参考视频跟随源图，请留空；显式填写会在提交前报错。
  llm_description: Optional geometry control for models that support it. Leave empty
    for Grok 1.5 preview reference video, whose output follows the source image.
  form: llm
  default: ''
- name: aspect_ratio
  type: string
  required: false
  label:
    en_US: Aspect ratio
    zh_Hans: 画面比例
  human_description:
    en_US: Optional geometry control for models that support it. Leave empty for Grok
      1.5 preview reference video, whose output follows the source image.
    zh_Hans: 仅支持该控制的型号可填写。Grok 1.5 preview 参考视频跟随源图，请留空；显式填写会在提交前报错。
  llm_description: Optional geometry control for models that support it. Leave empty
    for Grok 1.5 preview reference video, whose output follows the source image.
  form: llm
  default: ''
- name: parameters_json
  type: string
  required: false
  label:
    en_US: Advanced parameters (JSON)
    zh_Hans: 高级参数（JSON）
  human_description:
    en_US: Optional model-specific JSON. Reference images require a supporting model.
      Grok 1.5 preview accepts public HTTPS image URLs only; do not use data URLs.
    zh_Hans: 可选模型专属参数。参考图须选支持的型号；Grok 1.5 preview 只接收公开 HTTPS 图片 URL，不接受 data URL。
  llm_description: Optional model-specific JSON. Reference images require a supporting
    model. Grok 1.5 preview accepts public HTTPS image URLs only; do not use data
    URLs.
  form: llm
  default: '{}'
output_schema:
  type: object
  properties:
    task_id:
      type: string
    status:
      type: string
    terminal:
      type: boolean
    success:
      type: boolean
    result_state:
      type: string
    urls:
      type: array
      items:
        type: string
    generation_success:
      type: boolean
extra:
  python:
    source: tools/create_video.py
